# SPDX-License-Identifier: Apache-2.0
[package]
name = "task156-operation-journal-policy"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace]

[features]
default = []
# Qualification opt-in; never an approval or device-operation capability.
experimental-windows-storage = ["dep:winsafe", "dep:sha2"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", optional = true, default-features = false, features = ["advapi"] }
sha2 = { version = "=0.11.0", optional = true, default-features = false }

[dev-dependencies]
tempfile = "=3.24.0"
