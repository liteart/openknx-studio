[package]
name = "task153-broker-core"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "task153-peer-diagnostic"
path = "src/main.rs"

[[bin]]
name = "task153-operator-service"
path = "src/service_main.rs"

[[bin]]
name = "task153-operator-browser"
path = "src/browser_main.rs"

[[bin]]
name = "task153-install-preflight"
path = "src/install_preflight.rs"

[workspace]

[dependencies]
task152-passkey-prototype = { path = "../task152-passkey" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket", "user", "fs"] }
exacl = { git = "https://github.com/byllyfish/exacl.git", rev = "18275aa1a82aae9a786b108b0db0992a4d06e6e2", default-features = false }
webauthn-rs = { version = "=0.6.2", default-features = false }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
security-framework = { version = "=3.7.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.24.0"
socket2 = { version = "=0.6.5", default-features = false }

[dev-dependencies]
tempfile = "=3.24.0"
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey"] }
