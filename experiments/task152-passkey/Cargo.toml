[package]
name = "task152-passkey-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "task152-browser-demo"
path = "src/main.rs"

[workspace]

[features]
default = []
# Qualification opt-in only; this does not grant device-operation authority.
experimental-windows-journal = ["dep:winsafe"]

[dependencies]
webauthn-rs = { version = "=0.6.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", optional = true, default-features = false, features = ["advapi"] }

[dev-dependencies]
tempfile = "=3.24.0"
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey"] }
