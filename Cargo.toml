[package]
name = "knx-editor-toolchain-smoke"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
autobins = false

[lib]
name = "dca_state_poc"
path = "experiments/dca-state/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.24.0"

[[bin]]
name = "toolchain-smoke"
path = "experiments/toolchain-smoke/main.rs"

[[bin]]
name = "dca-state-poc"
path = "experiments/dca-state/main.rs"

[[test]]
name = "dca-state-cli"
path = "experiments/dca-state/cli_tests.rs"

[features]
default = []
